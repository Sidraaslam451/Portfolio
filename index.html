    <!-- Remember dark/light choice before the page loads (no flash) -->
    <script>
      try {
        var t = localStorage.getItem("theme");
        document.documentElement.setAttribute(
          "data-theme",
          t === "light" ? "light" : "dark"
        );
      } catch (e) {}
    </script>
